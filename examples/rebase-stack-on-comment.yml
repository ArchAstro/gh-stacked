name: Rebase stacked pull requests

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # The command also uses force-with-lease, but serializing stack rebases avoids
  # wasting runners when comments land on different PRs in the same stack.
  group: gh-stacked-rebase-${{ github.repository }}
  cancel-in-progress: false

jobs:
  rebase:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/stack rebase' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create stack bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.STACK_BOT_APP_ID }}
          private-key: ${{ secrets.STACK_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Rebase stack
        id: rebase
        # Replace this placeholder with the full commit SHA reviewed for your
        # repository. Never give a mutable action ref a write-capable token.
        uses: ArchAstro/gh-stacked@REPLACE_WITH_FULL_COMMIT_SHA
        with:
          pr-number: ${{ github.event.issue.number }}
          actor: ${{ github.event.comment.user.login }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          STACK_ID: ${{ steps.rebase.outputs.stack-id }}
          BASE_BRANCH: ${{ steps.rebase.outputs.base-branch }}
          REBASE_ACTION: ${{ steps.rebase.outputs.action }}
          REBASED_PRS: ${{ steps.rebase.outputs.rebased-pull-requests }}
          BLOCKED_PRS: ${{ steps.rebase.outputs.blocked-pull-requests }}
          BASE_MOVED: ${{ steps.rebase.outputs.base-moved-during-publication }}
        run: |
          if [[ "$REBASE_ACTION" == "partial" ]]; then
            rebased=$(jq -r 'if length == 0 then "none" else map("#" + tostring) | join(", ") end' <<<"$REBASED_PRS")
            blocked=$(jq -r '.[0]' <<<"$BLOCKED_PRS")
            base_note=""
            if [[ "$BASE_MOVED" == "true" ]]; then
              base_note=" The base branch advanced again during publication."
            fi
            gh pr comment "$PR_NUMBER" --body "Partially rebased stack \`$STACK_ID\` onto \`$BASE_BRANCH\`. Updated: $rebased. Stopped at conflicting PR #$blocked; its head ref and dependent head refs were not rewritten, though their diffs may change because the base moved.$base_note"
          else
            gh pr comment "$PR_NUMBER" --body "Rebased stack \`$STACK_ID\` onto the latest \`$BASE_BRANCH\`."
          fi

      - name: Report failure
        if: failure() && steps.rebase.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh pr comment "$PR_NUMBER" --body "Stack rebase did not complete. Check the run before retrying; one or more stack refs may already have been updated. [View the run]($RUN_URL)."
