name: Rebase stacked pull requests

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # The command also uses force-with-lease, but serializing stack rebases avoids
  # wasting runners when comments land on different PRs in the same stack.
  group: gh-stacked-rebase-${{ github.repository }}
  cancel-in-progress: false

jobs:
  rebase:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/stack rebase' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create stack bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.STACK_BOT_APP_ID }}
          private-key: ${{ secrets.STACK_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Rebase complete stack
        id: rebase
        # Replace this placeholder with the full commit SHA reviewed for your
        # repository. Never give a mutable action ref a write-capable token.
        uses: ArchAstro/gh-stacked@REPLACE_WITH_FULL_COMMIT_SHA
        with:
          pr-number: ${{ github.event.issue.number }}
          actor: ${{ github.event.comment.user.login }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          STACK_ID: ${{ steps.rebase.outputs.stack-id }}
          BASE_BRANCH: ${{ steps.rebase.outputs.base-branch }}
        run: gh pr comment "$PR_NUMBER" --body "Rebased stack \`$STACK_ID\` onto the latest \`$BASE_BRANCH\`."

      - name: Report failure
        if: failure() && steps.rebase.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh pr comment "$PR_NUMBER" --body "Stack rebase failed. Its atomic ref transaction prevents partial stack updates. [View the run]($RUN_URL)."
