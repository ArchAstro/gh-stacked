name: Rebase a gh-stacked PR stack
description: Rebase every safe PR ref in a gh-stacked stack and stop at the first conflict

inputs:
  pr-number:
    description: Any open pull request number in the stack
    required: true
  actor:
    description: GitHub login that must have write access to the repository
    required: true
  github-token:
    description: GitHub token used for PR discovery, actor authorization, and other API access
    required: true
  dry-run:
    description: Validate and rebase locally without updating remote refs
    required: false
    default: "false"
  allow-workflow-changes:
    description: Permit stacks that modify .github/workflows; requires a token with workflow publication permission
    required: false
    default: "true"

outputs:
  stack-id:
    description: The feature-branch identifier for the rebased stack
    value: ${{ steps.rebase.outputs.stack-id }}
  base-branch:
    description: The root pull request base branch used for the rebase
    value: ${{ steps.rebase.outputs.base-branch }}
  action:
    description: Whether the stack was fully rebased, partially rebased, or only previewed
    value: ${{ steps.rebase.outputs.action }}
  rebased-pull-requests:
    description: JSON array of pull request numbers successfully rebased
    value: ${{ steps.rebase.outputs.rebased-pull-requests }}
  blocked-pull-requests:
    description: JSON array containing the conflicting pull request and dependents whose head refs were not rewritten
    value: ${{ steps.rebase.outputs.blocked-pull-requests }}
  base-moved-during-publication:
    description: Whether the base branch advanced after a partial prefix was published
    value: ${{ steps.rebase.outputs.base-moved-during-publication }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false

    - name: Build gh-stacked
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        go build -trimpath -o "$RUNNER_TEMP/gh-stacked-rebase" .

    - name: Rebase stack
      id: rebase
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_ACTOR: ${{ inputs.actor }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_ALLOW_WORKFLOW_CHANGES: ${{ inputs.allow-workflow-changes }}
      run: |
        case "$INPUT_DRY_RUN" in
          true|false) ;;
          *)
            echo "::error::dry-run must be either true or false"
            exit 2
            ;;
        esac
        case "$INPUT_ALLOW_WORKFLOW_CHANGES" in
          true|false) ;;
          *)
            echo "::error::allow-workflow-changes must be either true or false"
            exit 2
            ;;
        esac

        args=(rebase --pr "$INPUT_PR_NUMBER" --actor "$INPUT_ACTOR" --json)
        if [[ "$INPUT_DRY_RUN" == "true" ]]; then
          args+=(--dry-run)
        fi
        if [[ "$INPUT_ALLOW_WORKFLOW_CHANGES" == "false" ]]; then
          args+=(--reject-workflow-changes)
        fi

        result="$("$RUNNER_TEMP/gh-stacked-rebase" "${args[@]}")"
        echo "$result"
        echo "stack-id=$(jq -r '.stack_id' <<<"$result")" >> "$GITHUB_OUTPUT"
        echo "base-branch=$(jq -r '.base_branch' <<<"$result")" >> "$GITHUB_OUTPUT"
        echo "action=$(jq -r '.action' <<<"$result")" >> "$GITHUB_OUTPUT"
        echo "rebased-pull-requests=$(jq -c '.pull_requests' <<<"$result")" >> "$GITHUB_OUTPUT"
        echo "blocked-pull-requests=$(jq -c '(.blocked_pull_requests // [])' <<<"$result")" >> "$GITHUB_OUTPUT"
        echo "base-moved-during-publication=$(jq -r '(.base_moved_during_publication // false)' <<<"$result")" >> "$GITHUB_OUTPUT"
