name: Bug report
description: Report reproducible incorrect behavior in gh-stacked
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Do not include secrets or private repository data.
  - type: input
    id: version
    attributes:
      label: gh-stacked version
      description: Output from `gh stacked version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, `gh version`, and `git version`.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps and commands that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: Remove tokens, private URLs, branch names, commit messages, and other sensitive data.
      render: shell
